# Foundry configuration
# Docs: https://book.getfoundry.sh/reference/config/

[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Supply-chain hardening: tests and scripts may never shell out or touch the filesystem.
ffi = false
fs_permissions = []

[profile.default.fuzz]
runs = 1000
max_test_rejects = 65536

[profile.default.invariant]
runs = 64
depth = 64
fail_on_revert = false

# CI profile: selected with FOUNDRY_PROFILE=ci. Much deeper fuzzing for the security gate.
[profile.ci]
verbosity = 2

[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 256
depth = 128

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
